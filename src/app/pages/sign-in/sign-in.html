<nz-row nzJustify="center" class="formulario" nzAlign="middle">
    <nz-col nzSpan="20">
        <form nz-form nzLayout="vertical" [formGroup]="loginForm">
            <nz-row class="titulo-descripcion">
                <nz-col nzSpan="10">
                    <h2 class="titulo text-center">Iní<span class="color">ciate</span></h2>
                </nz-col>
                <nz-col nzSpan="14">
                    <p class="textoRegistro text-center">¿Sin cuenta? <a [routerLink]="['/sign-up']"
                            class="color">Regístrate</a></p>
                </nz-col>
            </nz-row>

            <nz-form-item>
                <nz-form-control nzErrorTip="Por favor introduce un correo electronico." [nzSpan]="24">
                    <nz-input-wrapper class="wrap-email">
                        <nz-icon nzInputPrefix nzType="mail" nzTheme="outline" />
                        <input nz-input formControlName="email" type="text" placeholder="Correo electrónico">
                    </nz-input-wrapper>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item class="formItemPassword">
                <nz-form-control nzErrorTip="Por favor introduce la contraseña." [nzSpan]="24">
                    <nz-input-password class="wrap-password">
                        <nz-icon nzInputPrefix nzType="lock" nzTheme="outline" />
                        <input nz-input formControlName="password" type="text" placeholder="Contraseña">
                    </nz-input-password>
                </nz-form-control>
            </nz-form-item>

            <div nz-row [nzJustify]="'end'" class="nz-row-textForgetPassword">
                <div nz-col nzSpan="13"><a href="#" class="textForgetPassword">¿Olvidaste tu contraseña?</a></div>
            </div>

            <button nz-button class="btn-registrarse" (click)="iniciarSesion()"
                [disabled]="!loginForm.valid">Iniciar  sesión</button>

        </form>
    </nz-col>
</nz-row>
