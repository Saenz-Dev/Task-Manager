<section class="filters-shell">
    <div class="filters-head">
        <p class="filters-kicker">FILTROS</p>
        <h3 class="filters-title">Encuentra tareas en segundos</h3>
    </div>

    <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()" class="filters-form">
        <div nz-row [nzGutter]="[12, 12]" nzAlign="top" class="filters-row">
            <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8">
                <div class="filter-field">
                    <label class="filter-label">Prioridad</label>
                    <nz-select [(ngModel)]="selectedValue" [ngModelOptions]="{ standalone: true }" nzAllowClear nzPlaceHolder="Selecciona prioridad" class="filter-control">
                        <nz-option nzValue="alta" nzLabel="Alta"></nz-option>
                        <nz-option nzValue="media" nzLabel="Media"></nz-option>
                        <nz-option nzValue="baja" nzLabel="Baja"></nz-option>
                    </nz-select>
                </div>
            </div>

            <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="8">
                <div class="filter-field">
                    <label class="filter-label">Fecha</label>
                    <nz-date-picker class="filter-control" formControlName="datePicker" nzPlaceHolder="Seleccionar fecha"></nz-date-picker>
                </div>
            </div>

            <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="8" class="filters-actions">
                <button class="btn-clear-filters" nz-button nzType="default" type="button" (click)="clearFilters()">
                    <nz-icon nzType="close"></nz-icon>
                    Limpiar filtros
                </button>
            </div>
        </div>
    </form>
</section>
