<nz-collapse [nzBordered]="false">
    @for (tarea of tareas ; track tarea) {
    <nz-collapse-panel #p [nzHeader]="headerTemplate" [nzActive]="false" [nzShowArrow]="false">
        <p>{{ tarea.descripcion }} content</p>

    </nz-collapse-panel>
    <ng-template #headerTemplate>
        <div nz-row>
            <div class="checkbox-tarea" nz-col nzSpan="1">
                <label nz-checkbox ngModel="true"></label>
            </div>
            <div nz-col nzSpan="23">
                <div nz-row>
                    <div nz-col nzSpan="24">
                        <span class="titulo-tarea" style="margin-left: 8px;">
                            {{ tarea.titulo }}
                        </span>
                    </div>
                </div>
                <div nz-row>
                    <div nz-col nzSpan="24">
                        <div nz-row>
                            <div class="id_categoria-tarea" nz-col nzSpan="2" [style.background-color]="findCategoria(tarea.id_categoria)?.color_back" [style.color]="findCategoria(tarea.id_categoria)?.color" >
                                <p style="margin: 0px;" class="text-center">{{findCategoria(tarea.id_categoria)?.nombre}}</p>
                            </div>
                            <div class="fechaVencimiento-tarea" nz-col nzSpan="2">
                                <p style="margin: 0px;"><i class="bi bi-calendar" style="font-size: 12px;"></i> {{tarea.fecha_vencimiento.getFullYear()}}-{{tarea.fecha_vencimiento.getMonth()}}-{{tarea.fecha_vencimiento.getDay()}}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
    }
</nz-collapse>
